<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Registration</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <section id="pre-registration">
        <h2>Pre-Registration Form</h2>
        <p>Fill out the form below to express your interest in our properties before they are officially listed.</p>
        <form action="#" method="post">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" required>

            <label for="preferences">Property Preferences:</label>
            <textarea id="preferences" name="preferences" rows="4" placeholder="e.g., type of property, location, budget"></textarea>

            <button type="submit">Submit</button>
        </form>
    </section>
</body>
</html>
