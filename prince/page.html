<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Changeur de couleurs</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Color Changer</h1>
    <p class="description">Cliquez sur le bouton pour découvrir une nouvelle couleur.</p>
    <div id="color-box" role="status" aria-label="Couleur actuelle : corail"></div>
    <p class="color-value" id="color-value" aria-live="polite">#E9785B</p>
    <button id="change-color-btn" type="button">Change Color</button>
  </main>
</body>
</html>
