
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<script src="script.js"></script>
<title>Galerie d'images</title>
</head>
<body>
<h1>Ma Galerie d'Images</h1>
<div class="filters">
  <button class="active" data-filter="all">Tout</button>
  <button data-filter="Nature">Nature</button>
  <button data-filter="People">People</button>
  <button data-filter="Abstract">Abstract</button>
</div>

<div class="gallery">

  <div class="gallery-item" data-category="Nature">
    <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600" alt="Paysage naturel">
    <p>Nature</p>
  </div>

  <div class="gallery-item" data-category="People">
    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=600" alt="Portrait">
    <p>People</p>
  </div>

  <div class="gallery-item" data-category="Abstract">
    <img src="https://images.unsplash.com/photo-1541701494587-cb58502866ab?w=600" alt="Art abstrait">
    <p>Abstract</p>
  </div>

  <div class="gallery-item" data-category="Nature">
    <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=600" alt="Montagne">
    <p>Nature</p>
  </div>

  <div class="gallery-item" data-category="People">
    <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=600" alt="Portrait homme">
    <p>People</p>
  </div>

  <div class="gallery-item" data-category="Abstract">
    <img src="https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=600" alt="Composition abstraite">
    <p>Abstract</p>
  </div>

</div>
</body>
</html>
