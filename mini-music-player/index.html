<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lecteur — Himra</title>
<style>
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif;background:radial-gradient(circle at 30% 20%,#3a1a0a,#0a0d1f 70%);color:#f5ece0}
.player{width:340px;padding:24px;border-radius:24px;background:rgba(255,255,255,.06);backdrop-filter:blur(20px);box-shadow:0 30px 60px rgba(0,0,0,.5)}
.cover{width:100%;aspect-ratio:1;border-radius:16px;object-fit:cover;transition:transform .4s}
.playing .cover{transform:scale(1.03)}
h1{font-size:1.3rem;margin-top:18px}
p{opacity:.65;margin-top:4px}
.bar{height:6px;background:rgba(255,255,255,.15);border-radius:3px;margin-top:20px;cursor:pointer}
.fill{height:100%;width:0;background:#ff7a2f;border-radius:3px}
.time{display:flex;justify-content:space-between;font-size:.75rem;opacity:.6;margin-top:6px}
.controls{display:flex;justify-content:center;align-items:center;gap:20px;margin-top:14px}
button{border:0;cursor:pointer;color:inherit;background:none;font-size:1.4rem}
#play{width:64px;height:64px;border-radius:50%;background:#ff7a2f;color:#0a0d1f;font-size:1.6rem}
label{display:block;text-align:center;font-size:.75rem;opacity:.6;margin-top:16px;cursor:pointer;text-decoration:underline}
input[type=file]{display:none}
</style>
</head>
<body>
<div class="player" id="player">
  <img class="cover" src="cover.jpg" alt="Pochette Himra">
  <h1 id="title">Number One</h1>
  <p>Himra</p>
  <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
  <div class="time"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  <div class="controls">
    <button id="back">⏪</button><button id="play">▶</button><button id="fwd">⏩</button>
  </div>
  <label for="file">Charger un morceau de Himra (MP3)</label>
  <input type="file" id="file" accept="audio/*">
</div>
<audio id="audio" src="himra.mp3"></audio>
<script>
const a=document.getElementById('audio'),$=id=>document.getElementById(id);
const fmt=s=>isNaN(s)?'0:00':Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
$('play').onclick=()=>a.paused?a.play():a.pause();
a.onplay=()=>{$('play').textContent='❚❚';$('player').classList.add('playing')};
a.onpause=()=>{$('play').textContent='▶';$('player').classList.remove('playing')};
a.ontimeupdate=()=>{$('fill').style.width=(a.currentTime/a.duration*100||0)+'%';$('cur').textContent=fmt(a.currentTime)};
a.onloadedmetadata=()=>$('dur').textContent=fmt(a.duration);
$('bar').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();a.currentTime=(e.clientX-r.left)/r.width*a.duration};
$('back').onclick=()=>a.currentTime-=10;$('fwd').onclick=()=>a.currentTime+=10;
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;a.src=URL.createObjectURL(f);$('title').textContent=f.name.replace(/\.[^.]+$/,'');a.play()};
</script>
</body>
</html>
