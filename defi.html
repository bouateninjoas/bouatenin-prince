
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pricing Cards</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 20px;
      font-family: Arial, sans-serif;
      background: #f4f6fb;
    }

    .pricing-container {
      display: flex;
      justify-content: center;
      align-items: stretch;
      flex-wrap: wrap;
      gap: 25px;
      max-width: 1000px;
      margin: auto;
    }

    .pricing {
      width: 300px;
      padding: 30px 25px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      text-align: center;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .pricing:hover {
      transform: translateY(-6px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }

    .title {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .price {
      font-size: 30px;
      font-weight: bold;
      color: #16a34a;
    }

    .period {
      font-size: 14px;
      color: #777;
    }

    .features {
      list-style: none;
      padding: 0;
      margin: 25px 0;
      text-align: left;
    }

    .features li {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .btn {
      width: 100%;
      padding: 13px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn:hover {
      background: #1d4ed8;
    }

    .btn:focus-visible {
      outline: 3px solid #93c5fd;
      outline-offset: 3px;
    }

    @media (max-width: 600px) {
      .pricing {
        width: 100%;
        max-width: 350px;
      }
    }
  </style>
</head>

<body>

  <div class="pricing-container" id="pricing-container"></div>

  <script>
    // Reusable pricing card component
    function Card(title, price, period, features, buttonText) {
      const card = document.createElement("div");
      card.className = "pricing";

      const heading = document.createElement("h2");
      heading.className = "title";
      heading.textContent = title;

      const priceElement = document.createElement("p");
      priceElement.className = "price";
      priceElement.textContent = price;

      const periodElement = document.createElement("span");
      periodElement.className = "period";
      periodElement.textContent = period;

      const list = document.createElement("ul");
      list.className = "features";

      features.forEach(feature => {
        const item = document.createElement("li");
        item.textContent = feature;
        list.appendChild(item);
      });

      const button = document.createElement("button");
      button.className = "btn";
      button.textContent = buttonText;

      button.addEventListener("click", () => {
        alert("You selected the " + title + " plan!");
      });

      card.append(
        heading,
        priceElement,
        periodElement,
        list,
        button
      );

      return card;
    }

    // Create pricing cards
    const container = document.getElementById("pricing-container");

    container.appendChild(
      Card(
        "Basic Plan",
        "$9.99",
        "/month",
        ["1 GB Storage", "Basic Support", "All Core Features"],
        "Start Trial"
      )
    );

    container.appendChild(
      Card(
        "Pro Plan",
        "$19.99",
        "/month",
        ["10 GB Storage", "Priority Support", "Advanced Features"],
        "Choose Pro"
      )
    );

    container.appendChild(
      Card(
        "Premium Plan",
        "$29.99",
        "/month",
        ["Unlimited Storage", "24/7 Support", "All Premium Features"],
        "Get Premium"
      )
    );
  </script>

</body>
</html>
